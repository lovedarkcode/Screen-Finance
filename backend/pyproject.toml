[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-finance-backend"
version = "0.1.0"
description = "Screen Finance — AI-powered stock screener backend"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Screen Finance" }]
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["venv*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
