services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  quarterly-results-worker:
    build:
      context: ./backend
    profiles: ["results"]
    command: ["python", "-m", "app.workers.quarterly_results_worker", "--bootstrap"]
    env_file: ./backend/.env
    environment:
      DEBUG: "false"
      DATABASE_URL: ${RESULTS_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/screenfinance}
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: screenfinance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screenfinance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenfinance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: screenfinance-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: screenfinance-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
