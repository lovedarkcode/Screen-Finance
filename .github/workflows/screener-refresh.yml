name: Refresh production stock discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: production-screener-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lovedarkcode/Screen-Finance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.worker.txt
      - name: Install worker dependencies
        run: python -m pip install -r backend/requirements.worker.txt
      - name: Refresh one resumable batch
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SCREENER_DATABASE_URL }}
          ENVIRONMENT: production
          DEBUG: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
          RESULTS_BATCH_SIZE: '150'
        run: |
          test -n "$DATABASE_URL" || { echo 'SCREENER_DATABASE_URL is not configured'; exit 1; }
          python -B -m app.workers.stock_sync_worker --once
